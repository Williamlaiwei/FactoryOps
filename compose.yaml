services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__FactoryOps: "Host=db;Port=5432;Database=factoryops;Username=factoryops;Password=${POSTGRES_PASSWORD:?Password required}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: factoryops
      POSTGRES_USER: factoryops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryops -d factoryops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  